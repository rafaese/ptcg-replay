
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PTCG Replay — Visual (v2.2)</title>
<style>
body { font-family: 'Segoe UI', sans-serif; background: #f7f8fa; color: #222; margin: 0; }
header { background: #2a2f3a; color: white; padding: 1rem 2rem; font-size: 1.4rem; font-weight: bold; }
main { display: flex; padding: 1rem; gap: 1rem; }
#inputArea { width: 25%; background: #fff; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); padding: 1rem; display: flex; flex-direction: column; }
#field { flex: 1; background: #fff; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); padding: 1rem; }
textarea { width: 100%; height: 180px; resize: vertical; }
button { padding: 0.5rem 1rem; margin: 0.3rem; border: none; background: #4a90e2; color: white; border-radius: 6px; cursor: pointer; }
button:hover { background: #357ac8; }
#logParsed { white-space: pre-wrap; background: #fafafa; border: 1px solid #ddd; padding: 0.5rem; height: 200px; overflow-y: auto; border-radius: 5px; }
#timeline { margin-top: 1rem; padding: 0.5rem; background: #f0f0f5; border-radius: 5px; height: 300px; overflow-y: auto; }
#errorMsg { color: red; font-weight: bold; }
</style>
</head>
<body>
<header>PTCG Replay — Visual (v2.2)</header>
<main>
<section id="inputArea">
<h3>Cole o registro de batalha</h3>
<textarea id="battleLog" placeholder="Cole aqui o log da partida..."></textarea>
<div>
  <button id="generateBtn">Gerar</button>
  <button id="playBtn">▶ Play</button>
  <button id="pauseBtn">⏸ Pause</button>
</div>
<p><small>As imagens das cartas são buscadas automaticamente via Pokémon TCG API.</small></p>
<h4>Log parseado (JSON):</h4>
<pre id="logParsed">[vazio]</pre>
<p id="errorMsg"></p>
</section>

<section id="field">
<h3>Campo</h3>
<div><b>Turno:</b> <span id="turnNumber">-</span> | <b>Ação:</b> <span id="actionDesc">-</span></div>
<div id="timeline"></div>
</section>
</main>

<script>
function parseLog(text) {
    const lines = text.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);
    const turns = [];
    let currentTurn = { name: "Preparação", actions: [] };
    for (let line of lines) {
        try {
            if (/^Turn/.test(line)) {
                if (currentTurn.actions.length > 0) turns.push(currentTurn);
                currentTurn = { name: line, actions: [] };
            } else {
                currentTurn.actions.push(line);
            }
        } catch (err) {
            throw new Error("Erro ao processar linha: " + line + " — " + err.message);
        }
    }
    turns.push(currentTurn);
    return turns;
}

document.getElementById("generateBtn").addEventListener("click", () => {
    const input = document.getElementById("battleLog").value.trim();
    const logParsed = document.getElementById("logParsed");
    const errorMsg = document.getElementById("errorMsg");
    const timeline = document.getElementById("timeline");
    errorMsg.textContent = "";
    timeline.textContent = "";
    if (!input) {
        errorMsg.textContent = "⚠️ Cole um log primeiro.";
        return;
    }
    try {
        const parsed = parseLog(input);
        logParsed.textContent = JSON.stringify(parsed, null, 2);
        timeline.innerHTML = parsed.map((t, i) => 
            `<b>${i+1}. ${t.name}</b><br>${t.actions.map(a => a).join(" — ")}<br><br>`
        ).join("");
        document.getElementById("turnNumber").textContent = parsed.length;
        document.getElementById("actionDesc").textContent = "Log gerado com sucesso ✅";
    } catch (e) {
        errorMsg.textContent = e.message;
    }
});
</script>
</body>
</html>
